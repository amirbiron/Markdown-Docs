[alembic]
script_location = alembic
prepend_sys_path = .
# revision id מוגבל ל-12 תווים: alembic_version הוא VARCHAR(32) כברירת
# מחדל, ו-id ארוך יותר נחתך ונכשל רק ב-deploy טרי (כלל 11).
truncate_slug_length = 40
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
