[alembic]
script_location = alembic
prepend_sys_path = .
# מגביל את התיאור בשם *הקובץ* של המיגרציה, לא את ה-revision id.
# ה-id עצמו נקבע ידנית ב---rev-id, וחייב להישאר קצר מ-32 תווים, כי
# alembic_version.version_num הוא VARCHAR(32) כברירת מחדל — id ארוך
# יותר נחתך ונכשל רק ב-deploy טרי (כלל 11).
truncate_slug_length = 40
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
