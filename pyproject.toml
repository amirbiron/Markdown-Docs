# מטא-דאטה בלבד. ההתקנה עצמה נעשית דרך requirements.txt.
[project]
name = "markdown-docs"
version = "0.3.0"
description = "אתר תיעוד Markdown עם פרויקטים, מצב בהיר וכהה"
# enum.StrEnum, שבשימוש ב-app/models.py, קיים רק מ-3.11 ומעלה.
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
