# Render Blueprint.
# האתר כבר לא סטטי: FastAPI מגיש גם את ה-API תחת /api וגם את הפרונט
# מהשורש, מאותו origin. זה מה שמייתר CORS ומאפשר cookie עם SameSite=Lax.
# פריסה: New → Blueprint ב-Render, ולכוון לריפו הזה.

databases:
  - name: markdown-docs-db
    databaseName: markdown_docs
    user: markdown_docs
    plan: basic-256mb

services:
  - type: web
    name: markdown-docs
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # המיגרציות רצות לפני שהשרת עולה. אם הן נכשלות, הדיפלוי נכשל —
    # וזה עדיף על שרת שעולה מול סכימה ישנה ונשבר בבקשה הראשונה.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # הבדיקה הרדודה בכוונה. /api/health/db נוגע ב-DB, ואם Render היה
    # מנטר אותו, תקלת DB חולפת הייתה מפעילה את השירות מחדש בלולאה
    # ומחמירה את התקלה במקום לפתור אותה.
    healthCheckPath: /api/health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: markdown-docs-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11.11"

      # המשתמש היחיד. ה-seed בעלייה יוצר אותו אם אינו קיים, ולא נוגע בו
      # אם כן — כלומר שינוי הסיסמה כאן אחרי היצירה לא מחליף אותה.
      # sync: false => Render מבקש את הערך בפריסה ולא שומר אותו בריפו.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # מספר הפרוקסים המהימנים בין הלקוח לשרת. ב-Render יש אחד, והערך
      # הזה קובע מאיזה סוף של X-Forwarded-For נקראת כתובת הלקוח. ערך
      # שגוי כאן הופך את הגבלת הקצב לעקיפה בהחלפת מחרוזת.
      - key: TRUSTED_PROXY_HOPS
        value: "1"

      # RENDER_EXTERNAL_URL מוזרק אוטומטית על ידי Render ומשמש כברירת
      # מחדל ל-allowlist של Origin. ALLOWED_ORIGINS גובר עליו אם הוגדר.

# כותרות האבטחה עברו לאפליקציה (app/main.py, SECURITY_HEADERS).
# בלוק headers ב-render.yaml חל על אתרים סטטיים בלבד — אילו היה נשאר
# כאן, הוא היה מתעלם בשקט וה-CSP היה נעלם בלי שאף אחד ישים לב.
