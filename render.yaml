# Render Blueprint.
# האתר כבר לא סטטי: FastAPI מגיש גם את ה-API תחת /api וגם את הפרונט
# מהשורש, מאותו origin. זה מה שמייתר CORS ומאפשר cookie עם SameSite=Lax.
# פריסה: New → Blueprint ב-Render, ולכוון לריפו הזה.

databases:
  - name: markdown-docs-db
    databaseName: markdown_docs
    user: markdown_docs
    plan: basic-256mb

services:
  - type: web
    name: markdown-docs
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # המיגרציות רצות לפני שהשרת עולה. אם הן נכשלות, הדיפלוי נכשל —
    # וזה עדיף על שרת שעולה מול סכימה ישנה ונשבר בבקשה הראשונה.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # הבדיקה הרדודה בכוונה. /api/health/db נוגע ב-DB, ואם Render היה
    # מנטר אותו, תקלת DB חולפת הייתה מפעילה את השירות מחדש בלולאה
    # ומחמירה את התקלה במקום לפתור אותה.
    healthCheckPath: /api/health

    # הדיסק הקבוע לגיבויים. שלוש השלכות שכולן מקובלות כאן ושכדאי שיהיו
    # כתובות: השירות מוגבל למופע אחד ולא יכול להתרחב לרוחב, כל דיפלוי
    # כולל כמה שניות של חוסר זמינות (Render עוצר את המופע הישן לפני
    # שהוא מפעיל את החדש, כדי ששתי גרסאות לא יכתבו לאותו דיסק), והדיסק
    # דורש instance בתשלום.
    #
    # זו גם הסיבה שהמתזמן רץ בתוך השירות ולא כ-Cron Job: cron job של
    # Render אינו יכול לגשת לדיסק קבוע בכלל.
    disk:
      name: backups
      mountPath: /var/backups
      sizeGB: 1

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: markdown-docs-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11.11"

      # המשתמש היחיד. ה-seed בעלייה יוצר אותו אם אינו קיים, ולא נוגע בו
      # אם כן — כלומר שינוי הסיסמה כאן אחרי היצירה לא מחליף אותה.
      # sync: false => Render מבקש את הערך בפריסה ולא שומר אותו בריפו.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # מספר הפרוקסים המהימנים בין הלקוח לשרת. ב-Render יש אחד, והערך
      # הזה קובע מאיזה סוף של X-Forwarded-For נקראת כתובת הלקוח. ערך
      # שגוי כאן הופך את הגבלת הקצב לעקיפה בהחלפת מחרוזת.
      - key: TRUSTED_PROXY_HOPS
        value: "1"

      # יעד הגיבוי הוא נקודת העגינה של הדיסק שלמעלה.
      - key: BACKUP_DIR
        value: /var/backups

      # העותק שיוצא לטלגרם כבוי כברירת מחדל. להפעלה צריך גם להדליק את
      # הדגל וגם להגדיר BACKUP_PASSPHRASE ופרטי בוט — בלעדיהם השליחה
      # מדלגת ומדווחת, ולא שולחת ארכיון לא מוצפן.
      #
      # BACKUP_PASSPHRASE הוא המפתח לכל התוכן. אסור שיישב באותו מקום
      # שבו יושב הגיבוי: הוא כאן ובעותק אחד מחוץ למערכת, ולא נשלח
      # לטלגרם לצד הקובץ.
      - key: BACKUP_TELEGRAM_ENABLED
        value: "false"
      - key: BACKUP_PASSPHRASE
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

      # RENDER_EXTERNAL_URL מוזרק אוטומטית על ידי Render ומשמש כברירת
      # מחדל ל-allowlist של Origin. ALLOWED_ORIGINS גובר עליו אם הוגדר.

# כותרות האבטחה עברו לאפליקציה (app/main.py, SECURITY_HEADERS).
# בלוק headers ב-render.yaml חל על אתרים סטטיים בלבד — אילו היה נשאר
# כאן, הוא היה מתעלם בשקט וה-CSP היה נעלם בלי שאף אחד ישים לב.
